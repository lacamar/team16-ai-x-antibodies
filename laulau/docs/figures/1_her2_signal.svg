<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="300" fill="#fcfcfb"/>
  <text x="40" y="38" font-size="19" font-weight="600" fill="#0b0b0b">Stage 2 fine-tune pulls IgLM toward measured HER2 binders</text>
  <text x="40" y="60" font-size="13" fill="#52514e">Held-out CDRH3 negative log-likelihood by binding class &#183; lower = model finds the class more likely</text>

  <!-- x axis grid 1.5..3.5 mapped to 120..660 (domain 1.3..3.8) -->
  <g font-size="11" fill="#8a8984" text-anchor="middle">
    <line x1="120" y1="95" x2="120" y2="235" stroke="#ecebe7"/>
    <line x1="228" y1="95" x2="228" y2="235" stroke="#ecebe7"/><text x="228" y="252">1.5</text>
    <line x1="336" y1="95" x2="336" y2="235" stroke="#ecebe7"/><text x="336" y="252">2.0</text>
    <line x1="444" y1="95" x2="444" y2="235" stroke="#ecebe7"/><text x="444" y="252">2.5</text>
    <line x1="552" y1="95" x2="552" y2="235" stroke="#ecebe7"/><text x="552" y="252">3.0</text>
    <line x1="660" y1="95" x2="660" y2="235" stroke="#ecebe7"/><text x="660" y="252">3.5</text>
  </g>
  <text x="390" y="278" font-size="11" fill="#8a8984" text-anchor="middle">held-out NLL (nats)</text>

  <!-- rows: high y=120, med y=165, low y=210 -->
  <!-- high: base 586.4 -> best 158.2 -->
  <g>
    <line x1="158.2" y1="120" x2="586.4" y2="120" stroke="#cfcec9" stroke-width="2"/>
    <circle cx="586.4" cy="120" r="7" fill="#fcfcfb" stroke="#b4b3ad" stroke-width="2"/>
    <circle cx="158.2" cy="120" r="7.5" fill="#2a78d6"/>
    <text x="36" y="124" font-size="13" font-weight="600" fill="#0b0b0b">high</text>
    <text x="150" y="107" font-size="11" fill="#1c5cab" text-anchor="end">1.48</text>
    <text x="595" y="124" font-size="11" fill="#8a8984">3.46</text>
  </g>
  <!-- med: base 610.5 -> best 198.4 -->
  <g>
    <line x1="198.4" y1="165" x2="610.5" y2="165" stroke="#cfcec9" stroke-width="2"/>
    <circle cx="610.5" cy="165" r="7" fill="#fcfcfb" stroke="#b4b3ad" stroke-width="2"/>
    <circle cx="198.4" cy="165" r="7.5" fill="#2a78d6"/>
    <text x="36" y="169" font-size="13" font-weight="600" fill="#0b0b0b">med</text>
    <text x="190" y="152" font-size="11" fill="#1c5cab" text-anchor="end">1.66</text>
    <text x="619" y="169" font-size="11" fill="#8a8984">3.57</text>
  </g>
  <!-- low: base 624 -> best 257 -->
  <g>
    <line x1="257" y1="210" x2="624" y2="210" stroke="#cfcec9" stroke-width="2"/>
    <circle cx="624" cy="210" r="7" fill="#fcfcfb" stroke="#b4b3ad" stroke-width="2"/>
    <circle cx="257" cy="210" r="7.5" fill="#2a78d6"/>
    <text x="36" y="214" font-size="13" font-weight="600" fill="#0b0b0b">low</text>
    <text x="249" y="197" font-size="11" fill="#1c5cab" text-anchor="end">1.94</text>
    <text x="633" y="214" font-size="11" fill="#8a8984">3.64</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#52514e">
    <circle cx="470" cy="96" r="6" fill="#fcfcfb" stroke="#b4b3ad" stroke-width="2"/>
    <text x="482" y="100">pretrained</text>
    <circle cx="578" cy="96" r="6.5" fill="#2a78d6"/>
    <text x="590" y="100" fill="#1c5cab" font-weight="600">fine-tuned</text>
  </g>
  <text x="40" y="296" font-size="12" fill="#0b0b0b">Strong- vs weak-binder separation grows <tspan font-weight="700">+0.18 &#8594; +0.46</tspan> &#8212; the gap is the HER2 signal the model absorbed.</text>
</svg>
