<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="320" fill="#fcfcfb"/>
  <text x="40" y="38" font-size="19" font-weight="600" fill="#0b0b0b">Generation funnel &#8212; 20,000 full antibodies sampled with <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16">.generate</tspan></text>
  <text x="40" y="60" font-size="13" fill="#52514e">Each stage of the de-novo evaluation &#183; bar width &#8733; count</text>

  <!-- bars start x=250, width = count/20000*430 -->
  <g font-size="12">
    <!-- raw 20000 -> 430 -->
    <rect x="250" y="90"  width="430"   height="26" rx="4" fill="#184f95"/>
    <text x="240" y="107" fill="#0b0b0b" text-anchor="end">raw valid + terminating</text>
    <text x="672" y="107" font-weight="600" fill="#fcfcfb" text-anchor="end">20,000</text>
    <!-- distinct 19101 -> 410.7 -->
    <rect x="250" y="132" width="410.7" height="26" rx="4" fill="#256abf"/>
    <text x="240" y="149" fill="#0b0b0b" text-anchor="end">distinct VH</text>
    <text x="652" y="149" font-weight="600" fill="#fcfcfb" text-anchor="end">19,101</text>
    <!-- locatable 19101 -> 410.7 -->
    <rect x="250" y="174" width="410.7" height="26" rx="4" fill="#2a78d6"/>
    <text x="240" y="191" fill="#0b0b0b" text-anchor="end">CDRH3 locatable</text>
    <text x="652" y="191" font-weight="600" fill="#fcfcfb" text-anchor="end">19,101 &#183; 100%</text>
    <!-- novel 8336 -> 179.2 -->
    <rect x="250" y="216" width="179.2" height="26" rx="4" fill="#5598e7"/>
    <text x="240" y="233" fill="#0b0b0b" text-anchor="end">novel CDRH3 vs screen</text>
    <text x="439" y="233" font-weight="600" fill="#1c5cab">8,336 &#183; 44%</text>
    <!-- eligible 20 -> sliver -->
    <rect x="250" y="258" width="4"     height="26" rx="2" fill="#eb6834"/>
    <text x="240" y="275" fill="#0b0b0b" text-anchor="end">eligible (abguard gate)</text>
    <text x="264" y="275" font-weight="700" fill="#c0491f">20</text>
  </g>

  <text x="40" y="308" font-size="12" fill="#0b0b0b">Generation is healthy and diverse; the <tspan font-weight="700">conservative novelty gate</tspan> is the bottleneck, not the model.</text>
</svg>
